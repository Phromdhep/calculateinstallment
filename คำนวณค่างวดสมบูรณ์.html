<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เครื่องมือคำนวณ</title>
  <style>
    :root{
      --red:#b30000;
      --red-soft:#ffe6e6;
      --bg:#fff5f5;
      --text:#3a0000;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans", Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .container{
      max-width:480px;
      margin:0 auto;
      padding:16px;
    }
    header{
      text-align:center;
      padding:12px 0 20px;
    }
    h1{
      margin:0;
      color:var(--red);
      font-size:24px;
    }
    .card{
      background:#ffffff;
      border:1px solid var(--red);
      border-radius:12px;
      padding:14px;
      box-shadow: 0 2px 8px rgba(179,0,0,0.08);
    }
    label{
      display:block;
      font-weight:600;
      margin-top:12px;
      color:var(--red);
    }
    input[type="text"], select, button{
      width:100%;
      padding:12px;
      font-size:16px;
      border:1px solid var(--red);
      border-radius:10px;
      background:#fff;
      color:var(--text);
      outline:none;
    }
    input[type="text"]:focus, select:focus{
      border-color:#ff3b3b;
      box-shadow:0 0 0 3px rgba(255,59,59,0.15);
    }
    .inline-help{
      font-size:13px;
      color:#7a1f1f;
      margin-top:6px;
    }
    button{
      background:var(--red);
      color:#fff;
      font-weight:700;
      margin-top:18px;
      border:none;
    }
    button:active{transform:scale(0.99)}
    .result{
      margin-top:16px;
      background:var(--red-soft);
      border:1px solid var(--red);
      border-radius:12px;
      padding:14px;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px 0;
      border-bottom:1px dashed #f2b9b9;
    }
    .row:last-child{border-bottom:none}
    .label{
      color:#7a1f1f;
      font-weight:600;
      font-size:14px;
    }
    .value{
      color:#000;
      font-weight:700;
      font-size:16px;
    }
    .error{
      background:#fff0f0;
      border:1px solid #ff6b6b;
      color:#9b0000;
      border-radius:10px;
      padding:10px;
      margin-top:12px;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    @media (min-width:420px){
      .grid-2{grid-template-columns:1fr 1fr}
    }
    .section-title{
      margin-top:8px;
      font-weight:800;
      color:var(--red);
      font-size:16px;
    }
    .muted{
      color:#823232;
      font-size:20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>เครื่องมือคำนวณ</h1>
      <div class="muted">ค่างวดรายเดือน</div>
    </header>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label for="program">โปรแกรม</label>
          <select id="program" onchange="onProgramChange()">
            <option value="">-- เลือกโปรแกรม --</option>
            <option value="home_50">กู้ซื้อบ้าน Homeloan4U สำหรับผู้มีรายได้ตั้งแต่ 50,000 บาท ขึ้นไป</option>
            <option value="home_30">กู้ซื้อบ้าน Homeloan4U สำหรับผู้มีรายได้ตั้งแต่ 30,000 บาท ขึ้นไป</option>
            <option value="refi_1">รีไฟแนนซ์ Balance Transfer เรียกเก็บค่าจดจำนอง 1%</option>
            <option value="refi_0">รีไฟแนนซ์ Balance Transfer ยกเว้นค่าจดจำนอง 1%</option>
            <option value="cash_50">บ้านแลกเงิน Home4Cash สำหรับผู้มีรายได้ตั้งแต่ 50,000 บาท ขึ้นไป</option>
            <option value="cash_30">บ้านแลกเงิน Home4Cash สำหรับผู้มีรายได้ตั้งแต่ 30,000 บาท ขึ้นไป</option>
          </select>
        </div>

        <div>
          <label for="term">ระยะเวลากู้ยืม (ปี)</label>
          <select id="term">
            <option value="">-- เลือกระยะเวลา --</option>
          </select>
        </div>
          <a href="https://m-pre-sg.zatech.com/m/p/MRTAQuotation?ref=7a97e48056a4f1f4c18c336f2faa11b808d8a60e41d21c6976b79c9dab3c6d54&module=510e8f4c-37d0-4a17-baa4-cd6ca44456b5&clientId=Wm1hcnQ6cHJ1ZGVudGlhbDowMjI&moduleId=369930448977926&pageId=369930448977951&orderNo=ZORDER0057358699" target="_blank" rel="noopener noreferrer" class="h1">คำนวณเบี้ยประกันชีวิต คลิก!</a>
        </div>
      </div>

      <label for="loanAmount">วงเงินที่ต้องการกู้ (บาท)</label>
      <input type="text" id="loanAmount" inputmode="numeric" placeholder=">-- กรุณากรอกวงเงินที่ต้องการกู้ เช่น 1,000,000 --<" oninput="formatNumber(this)" />
      <div id="minHint" class="inline-help">กรุณาเลือกโปรแกรมเพื่อดูวงเงินขั้นต่ำที่กำหนด</div>

      <label for="paymentType">รูปแบบการผ่อนชำระ</label>
      <select id="paymentType">
        <option value="flat">แบบที่ 1 : ผ่อนเท่ากันทุกเดือน (Flat Rate)</option>
        <option value="step">แบบที่ 2 : ดอกเบี้ยต่ำผ่อนต่ำ (Interest Based Rate)</option>
      </select>

      <button onclick="calculate()">คำนวณ</button>

      <div id="messages"></div>
      <div id="result" class="result" style="display:none"></div>
    </div>
  </div>

  <script>
    // อัตราดอกเบี้ยสำหรับแบบที่ 1 (ใช้สูตร PMT ตามอัตราดอกเบี้ยของโปรแกรม/ระยะเวลา)
    const ratesFlat = {
      home_50: {35:7.20,30:7.16,25:7.09,20:7.00,15:6.84,10:6.52,5:5.56},
      home_30: {35:7.23,30:7.19,25:7.13,20:7.04,15:6.90,10:6.61,5:5.75},
      refi_1:  {35:7.15,30:7.09,25:7.02,20:6.90,15:6.71,10:6.33,5:5.19},
      refi_0:  {35:7.16,30:7.11,25:6.74,20:6.63,15:6.75,10:6.38,5:5.29},
      cash_50: {20:8.11,15:7.99,10:7.75,5:7.03},
      cash_30: {20:8.17,15:8.07,10:7.86,5:7.25}
    };

    // อัตราดอกเบี้ยสำหรับแบบที่ 2 (ปี 1-3 ดอกเบี้ยคงที่/จ่ายดอกล้วน, หลังจากนั้นใช้ PMT)
    const ratesStep = {
      home_50: {y1:5.03, y2:5.03, y3:5.03, after:7.48},
      home_30: {y1:5.35, y2:5.35, y3:5.35, after:7.48},
      refi_1:  {y1:3.29, y2:4.99, y3:4.99, after:7.48},
      refi_0:  {y1:4.59, y2:4.59, y3:4.59, after:7.48},
      cash_50: null, // ไม่สามารถเลือกรูปแบบนี้ได้
      cash_30: null  // ไม่สามารถเลือกรูปแบบนี้ได้
    };

    // วงเงินขั้นต่ำตามโปรแกรม
    const minAmountMap = {
      home_50: 500_000,
      home_30: 500_000,
      refi_1:  1_000_000,
      refi_0:  1_000_000,
      cash_50: 300_000,
      cash_30: 300_000
    };

    function formatNumber(input){
      const raw = input.value.replace(/,/g,'').replace(/[^\d]/g,'');
      if(raw === '') { input.value=''; return; }
      input.value = Number(raw).toLocaleString('en');
    }

    function onProgramChange(){
      const program = document.getElementById('program').value;
      const termEl = document.getElementById('term');
      const minHint = document.getElementById('minHint');

      // ตั้งค่าขั้นต่ำ
      if(program){
        const minAmt = minAmountMap[program];
        minHint.textContent = `ขั้นต่ำ: ${minAmt.toLocaleString('en')} บาท`;
      } else {
        minHint.textContent = 'กรุณาเลือกโปรแกรมเพื่อดูวงเงินขั้นต่ำที่กำหนด';
      }

      // ตั้งค่า term ตามโปรแกรม
      termEl.innerHTML = '<option value="">-- เลือกระยะเวลา --</option>';
      let options = [];
      if(program.startsWith('home') || program.startsWith('refi')){
        options = [35,30,25,20,15,10,5];
      } else if(program.startsWith('cash')){
        options = [20,15,10,5]; // สูงสุด 20 ปีสำหรับบ้านแลกเงิน
      }
      options.forEach(y=>{
        const opt = document.createElement('option');
        opt.value = String(y);
        opt.textContent = `${y} ปี`;
        termEl.appendChild(opt);
      });
    }

    // ฟังก์ชัน PMT มาตรฐาน
    function pmt(ratePerPeriod, nPeriods, presentValue){
      if(ratePerPeriod === 0){
        return presentValue / nPeriods;
      }
      const r = ratePerPeriod;
      const factor = Math.pow(1 + r, nPeriods);
      return presentValue * r * factor / (factor - 1);
    }

    // ปัดขึ้นเป็นจำนวนเต็มหลักสิบ
    function roundUpToNearestTen(num){
      return Math.ceil(num / 10) * 10;
    }

    function showError(msg){
      const messages = document.getElementById('messages');
      const result = document.getElementById('result');
      messages.innerHTML = `<div class="error">${msg}</div>`;
      result.style.display = 'none';
      result.innerHTML = '';
    }

    function showResult(html){
      const messages = document.getElementById('messages');
      const result = document.getElementById('result');
      messages.innerHTML = '';
      result.style.display = 'block';
      result.innerHTML = html;
    }

    function parseAmount(){
      const val = document.getElementById('loanAmount').value.replace(/,/g,'');
      if(!val || isNaN(val)) return null;
      return Number(val);
    }

    function calculate(){
      const program = document.getElementById('program').value;
      const termStr = document.getElementById('term').value;
      const payType = document.getElementById('paymentType').value;
      const amount = parseAmount();

      if(!program){ return showError('กรุณาเลือกโปรแกรม'); }
      if(!termStr){ return showError('กรุณาเลือกระยะเวลากู้ยืม'); }
      if(amount === null){ return showError('กรุณาระบุวงเงินเป็นตัวเลขเท่านั้น'); }

      const termYears = Number(termStr);
      const minAmt = minAmountMap[program];
      if(amount < minAmt){
        return showError('วงเงินกู้ต่ำกว่าขั้นต่ำที่กำหนดสำหรับโปรแกรมนี้');
      }

      // แบบที่ 2 ไม่รองรับสำหรับบ้านแลกเงิน
      if(payType === 'step' && program.startsWith('cash')){
        return showError('ไม่สามารถเลือกรูปแบบการผ่อนชำระนี้ได้');
      }

      // แบบที่ 1: PMT ด้วยอัตราดอกเบี้ยตามตาราง
      if(payType === 'flat'){
        const rateYear = ratesFlat[program][termYears];
        if(typeof rateYear !== 'number'){
          return showError('ไม่พบอัตราดอกเบี้ยสำหรับโปรแกรม/ระยะเวลาที่เลือก');
        }
        const monthlyRate = rateYear / 100 / 12;
        const n = termYears * 12;
        const pmtVal = pmt(monthlyRate, n, amount);
        const rounded = roundUpToNearestTen(pmtVal);
        const html = `
          <div class="section-title">ผลการคำนวณ</div>
          <div class="row">
            <div class="label">ยอดผ่อนชำระขั้นต่ำต่อเดือน</div>
            <div class="value">${rounded.toLocaleString('en')} บาท</div>
          </div>
          <div class="row">
            <div class="label">หมายเหตุ : เป็นเพียงการคำนวณเบื้องต้นประกอบการตัดสินใจ อาจมีการเปลี่ยนแปลงได้</div>
          </div>
        `;
        return showResult(html);
      }

      // แบบที่ 2: ปี 1-3 ดอกเบี้ยล้วน จากนั้น PMT ด้วยยอดเงินคงเหลือ (ถือว่าเท่ากับวงเงินกู้)
      if(payType === 'step'){
        const cfg = ratesStep[program];
        if(!cfg){ return showError('ไม่สามารถเลือกรูปแบบการผ่อนชำระนี้ได้'); }

        // ปี 1-3: (วงเงิน * อัตราดอกเบี้ยปีนั้น) / 12
        const y1Pay = roundUpToNearestTen((amount * (cfg.y1/100)) / 12);
        const y2Pay = roundUpToNearestTen((amount * (cfg.y2/100)) / 12);
        const y3Pay = roundUpToNearestTen((amount * (cfg.y3/100)) / 12);

        // หลังจากนั้น: PMT ด้วยอัตราหลังจากนั้น, จำนวนงวด = ทั้งหมด - 36, ยอดเงินคงเหลือ = วงเงิน (สมมติจ่ายดอกล้วน 3 ปี)
        const totalMonths = termYears * 12;
        if(totalMonths <= 36){
          return showError('ระยะเวลาไม่พอสำหรับรูปแบบดอกเบี้ยต่ำผ่อนต่ำ (ต้องมากกว่า 3 ปี)');
        }
        const remainingMonths = totalMonths - 36;
        const afterMonthlyRate = (cfg.after / 100) / 12;
        const pmtAfter = pmt(afterMonthlyRate, remainingMonths, amount);
        const pmtAfterRounded = roundUpToNearestTen(pmtAfter);

	const html = `
          <div class="section-title">ผลการคำนวณ</div>
          <div class="row">
            <div class="label">ปีที่ 1</div>
            <div class="value">${y1Pay.toLocaleString('en')} บาท/เดือน</div>
          </div>
          <div class="row">
            <div class="label">ปีที่ 2</div>
            <div class="value">${y2Pay.toLocaleString('en')} บาท/เดือน</div>
          </div>
          <div class="row">
            <div class="label">ปีที่ 3</div>
            <div class="value">${y3Pay.toLocaleString('en')} บาท/เดือน</div>
          </div>
          <div class="row">
            <div class="label">ปีที่ 4 เป็นต้นไป</div>
            <div class="value">${pmtAfterRounded.toLocaleString('en')} บาท/เดือน</div>
          </div>
          <div class="row">
            <div class="label">หมายเหตุ : ผลการคำนวณเป็นเพียงการคำนวณเบื้องต้นประกอบการตัดสินใจ อาจมีการเปลี่ยนแปลงได้</div>
          </div>
        `;

        return showResult(html);
      }
    }
  </script>
</body>
</html>
